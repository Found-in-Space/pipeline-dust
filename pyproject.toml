[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pipeline-dust"
version = "0.1.0"
description = "3D interstellar dust map pipeline (Rezaei et al. / CDS finalmap → viewer-ready artifacts)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "click>=8.3.1",
]

[project.scripts]
dust-pipeline = "pipeline_dust.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/pipeline_dust"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=6",
    "coverage[toml]>=7",
    "pre-commit>=4",
    "ruff>=0.15.8",
]

[tool.ruff]
target-version = "py310"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.coverage.run]
source = ["src/pipeline_dust"]
branch = true
omit = ["*/__main__.py"]

[tool.coverage.report]
show_missing = true
exclude_lines = ["pragma: no cover"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib --cov=pipeline_dust --cov-report=term-missing"
testpaths = ["tests"]
pythonpath = ["src"]
